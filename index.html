<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - Job Openings</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .job-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; transition: transform 0.2s; }
        .job-card:hover { transform: translateY(-5px); }
        .job-title { color: #2c3e50; margin-top: 0; }
        .job-meta { color: #7f8c8d; font-size: 0.9em; margin-bottom: 15px; }
        .job-meta span { margin-right: 15px; background: #eef2f3; padding: 4px 10px; border-radius: 4px; display: inline-block; }
        
        /* 💡 This magic CSS property fixes the Enter/New Line spacing issue */
        .job-desc { color: #555; line-height: 1.6; white-space: pre-line; }
        
        .btn-apply { display: inline-block; background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; transition: background-color 0.2s; }
        .btn-apply:hover { background-color: #0056b3; }
        #loading { text-align: center; font-size: 1.2em; color: #666; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>💼 Open Positions</h1>
    <div id="jobs-container">
        <div id="loading">Loading current job openings from database...</div>
    </div>
</div>

<script>
	const baseUrl = (window.location.hostname === 'localhost' || window.location.protocol === 'file:')
  		? 'http://localhost:5678'
  		: 'https://https://pixels-recruitment.loca.lt';

	const n8nWebhookUrl = `${baseUrl}/webhook/get-all-jobs`;

    async function fetchJobs() {
        try {
            const response = await fetch(n8nWebhookUrl);
            const jobs = await response.json();
            
            const container = document.getElementById('jobs-container');
            container.innerHTML = ''; 
            
            if (!jobs || jobs.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No job openings available at the moment.</p>';
                return;
            }

            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <h2 class="job-title">${job.job_title || 'Untitled Position'}</h2>
                    <div class="job-meta">
                        <span><strong>Job ID:</strong> ${job.job_id}</span>
                        <span><strong>Application Deadline:</strong> ${job.application_deadline || 'Open'}</span>
                    </div>
                    <p class="job-desc">${(job.job_description || 'No description available.').replace(/^([A-Za-z\s]+:)/gm, '<strong>$1</strong>')}</p>
                    <a href="apply.html?job_id=${job.job_id}" class="btn-apply">Apply For This Job</a>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            console.error('Error fetching jobs:', error);
            document.getElementById('jobs-container').innerHTML = '<p style="text-align:center; color:red;">Sorry, an error occurred while loading job positions.</p>';
        }
    }

    window.onload = fetchJobs;
</script>

</body>
</html>
